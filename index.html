<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer — Cubo² ao Quadrado</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap');

  :root{
    --ink:#111111;
    --paper:#FAFAF7;
    --paper-2:#F1EFE9;
    --red:#E7291C;
    --blue:#1F4FD8;
    --grey:#6B6B66;
    --grey-light:#D8D5CC;
    --ready:#1F9D55;
    --border-w: 3px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    width:100%;
    max-width:620px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand img{
    width:56px;
    height:56px;
    display:block;
  }
  .brand-text h1{
    font-size:18px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
    line-height:1.15;
  }
  .brand-text span{
    font-size:13px;
    color:var(--grey);
    font-weight:500;
  }

  .subscribe{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--red);
    color:#fff;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    text-decoration:none;
    padding:11px 18px;
    border:var(--border-w) solid var(--ink);
    border-radius:8px;
    box-shadow:3px 3px 0 var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
    white-space:nowrap;
  }
  .subscribe:hover{
    transform:translate(-2px,-2px);
    box-shadow:5px 5px 0 var(--ink);
  }
  .subscribe:active{
    transform:translate(0,0);
    box-shadow:1px 1px 0 var(--ink);
  }
  .subscribe svg{width:16px;height:16px;flex-shrink:0;}

  /* ---------- Auth / sync bar ---------- */
  .auth-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:#fff;
    border:2px solid var(--grey-light);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .google-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#fff;
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    border:2px solid var(--ink);
    border-radius:7px;
    padding:8px 14px;
    cursor:pointer;
  }
  .google-btn:hover{ background:var(--paper-2); }
  .google-btn svg{ width:16px; height:16px; }

  .user-info{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
  }
  .user-info img{
    width:26px;
    height:26px;
    border-radius:50%;
    border:2px solid var(--ink);
  }
  .user-info .name{ font-weight:600; }
  .signout-btn{
    background:none;
    border:none;
    color:var(--red);
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .sync-status{
    font-size:12px;
    color:var(--grey);
    font-weight:500;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .sync-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--grey-light);
    flex-shrink:0;
  }
  .sync-dot.ok{ background:var(--ready); }
  .sync-dot.busy{ background:#E0A716; }

  /* ---------- Scramble ---------- */
  .scramble-card{
    background:var(--paper-2);
    border:var(--border-w) solid var(--ink);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:22px;
  }
  .scramble-label{
    font-size:11px;
    font-weight:700;
    color:var(--grey);
    margin-bottom:6px;
  }
  .scramble-moves{
    font-family:'JetBrains Mono', monospace;
    font-size:17px;
    font-weight:700;
    letter-spacing:0.02em;
    line-height:1.5;
    word-spacing:4px;
  }
  .scramble-refresh{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--blue);
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:12px;
    padding:0;
    margin-top:10px;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  /* ---------- Cube net (conferir scramble) ---------- */
  .cube-card{
    background:#fff;
    border:var(--border-w) solid var(--ink);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:22px;
  }
  .cube-card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .cube-card-header .cube-label{
    font-size:11px;
    font-weight:700;
    color:var(--grey);
  }
  .cube-toggle{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--blue);
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:12px;
    padding:0;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .cube-net{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-template-rows:repeat(3, 1fr);
    gap:4px;
    max-width:340px;
    margin:0 auto;
  }
  .cube-face{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:2px;
    background:var(--ink);
    padding:2px;
    border-radius:4px;
  }
  .cube-face.pos-U{ grid-column:2; grid-row:1; }
  .cube-face.pos-L{ grid-column:1; grid-row:2; }
  .cube-face.pos-F{ grid-column:2; grid-row:2; }
  .cube-face.pos-R{ grid-column:3; grid-row:2; }
  .cube-face.pos-B{ grid-column:4; grid-row:2; }
  .cube-face.pos-D{ grid-column:2; grid-row:3; }
  .cube-sticker{
    aspect-ratio:1/1;
    border-radius:2px;
    border:1px solid rgba(0,0,0,0.25);
  }

  /* ---------- Timer ---------- */
  .timer-zone{
    background:var(--ink);
    border-radius:14px;
    padding:52px 20px;
    text-align:center;
    margin-bottom:22px;
    cursor:pointer;
    user-select:none;
    transition:background .15s ease;
    position:relative;
    overflow:hidden;
  }
  .timer-zone.armed{ background:#B8241A; }
  .timer-zone.running{ background:var(--ready); }

  .timer-display{
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(48px, 14vw, 76px);
    font-weight:800;
    color:#fff;
    letter-spacing:-0.02em;
    line-height:1;
  }
  .timer-hint{
    margin-top:14px;
    font-size:13px;
    color:rgba(255,255,255,0.65);
    font-weight:500;
  }

  /* ---------- Stats ---------- */
  .stats-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:22px;
  }
  .stat-box{
    border:var(--border-w) solid var(--ink);
    border-radius:10px;
    padding:14px;
    text-align:center;
    background:#fff;
  }
  .stat-box .val{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:22px;
  }
  .stat-box .lbl{
    font-size:11px;
    color:var(--grey);
    font-weight:600;
    margin-top:4px;
  }

  /* ---------- Times list ---------- */
  .times-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .times-header h2{
    font-size:15px;
    margin:0;
    font-weight:700;
  }
  .clear-btn{
    background:none;
    border:none;
    color:var(--grey);
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .times-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:280px;
    overflow-y:auto;
  }
  .time-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff;
    border:2px solid var(--grey-light);
    border-radius:8px;
    padding:10px 14px;
    font-size:14px;
  }
  .time-row .n{
    color:var(--grey);
    font-weight:600;
    font-size:12px;
    width:28px;
  }
  .time-row .t{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:16px;
    flex:1;
    text-align:left;
    padding-left:10px;
  }
  .time-row .s{
    font-family:'JetBrains Mono', monospace;
    color:var(--grey);
    font-size:11px;
    flex:2;
    text-align:right;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    padding-right:10px;
  }
  .time-row .del{
    background:none;
    border:none;
    color:var(--red);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:2px 4px;
  }
  .empty-state{
    text-align:center;
    color:var(--grey);
    font-size:13px;
    padding:30px 0;
  }

  footer{
    text-align:center;
    margin-top:30px;
    font-size:12px;
    color:var(--grey-light);
  }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  query, orderBy, getDocs, writeBatch, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCUCiMFT-4DybAvvAaypBvOP22Dq7U4SVQ",
  authDomain: "oll-tracker.firebaseapp.com",
  projectId: "oll-tracker",
  storageBucket: "oll-tracker.firebasestorage.app",
  messagingSenderId: "174959762137",
  appId: "1:174959762137:web:bb64970ab286347653bcc8"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const provider = new GoogleAuthProvider();

(function(){
  const FACES = ['R','L','U','D','F','B'];
  const MODS = ['', "'", '2'];
  const OPP = { R:'L', L:'R', U:'D', D:'U', F:'B', B:'F' };

  function genScramble(len){
    len = len || 20;
    const seq = [];
    let lastFace = null, lastAxisFace = null;
    while(seq.length < len){
      let face = FACES[Math.floor(Math.random()*FACES.length)];
      if(face === lastFace || face === lastAxisFace) continue;
      const mod = MODS[Math.floor(Math.random()*MODS.length)];
      seq.push(face+mod);
      lastAxisFace = lastFace === OPP[face] ? lastFace : null;
      lastFace = face;
    }
    return seq.join(' ');
  }

  let currentScramble = genScramble();
  const scrambleEl = document.getElementById('scrambleText');
  scrambleEl.textContent = currentScramble;

  // ---------- Simulação do cubo (para conferir o scramble) ----------
  const COLORS = { U:'#FFFFFF', D:'#FFD500', F:'#009E60', B:'#0051BA', L:'#FF5800', R:'#B71234' };
  const FACE_OF_DIR = { py:'U', ny:'D', pz:'F', nz:'B', nx:'L', px:'R' };

  function solvedCubies(){
    const cubies = [];
    for(let x=-1;x<=1;x++) for(let y=-1;y<=1;y++) for(let z=-1;z<=1;z++){
      if(x===0 && y===0 && z===0) continue;
      const colors = {};
      if(x===1) colors.px = 'R';
      if(x===-1) colors.nx = 'L';
      if(y===1) colors.py = 'U';
      if(y===-1) colors.ny = 'D';
      if(z===1) colors.pz = 'F';
      if(z===-1) colors.nz = 'B';
      cubies.push({ x, y, z, colors });
    }
    return cubies;
  }

  const ROTATE = {
    U: (x,y,z) => [z, y, -x],
    D: (x,y,z) => [-z, y, x],
    R: (x,y,z) => [x, z, -y],
    L: (x,y,z) => [x, -z, y],
    F: (x,y,z) => [y, -x, z],
    B: (x,y,z) => [-y, x, z],
  };
  const SELECTOR = {
    U: c => c.y === 1, D: c => c.y === -1,
    R: c => c.x === 1, L: c => c.x === -1,
    F: c => c.z === 1, B: c => c.z === -1,
  };
  const DIR_VEC = { px:[1,0,0], nx:[-1,0,0], py:[0,1,0], ny:[0,-1,0], pz:[0,0,1], nz:[0,0,-1] };
  const VEC_DIR = new Map(Object.entries(DIR_VEC).map(([k,v]) => [v.join(','), k]));

  function turnFace(cubies, face, times){
    const rotate = ROTATE[face];
    const selected = cubies.filter(SELECTOR[face]);
    for(let t=0;t<times;t++){
      selected.forEach(c => {
        const [nx,ny,nz] = rotate(c.x, c.y, c.z);
        const newColors = {};
        for(const [dirKey, color] of Object.entries(c.colors)){
          const v = DIR_VEC[dirKey];
          const [rx,ry,rz] = rotate(v[0], v[1], v[2]);
          newColors[VEC_DIR.get([rx,ry,rz].join(','))] = color;
        }
        c.x = nx; c.y = ny; c.z = nz; c.colors = newColors;
      });
    }
  }

  function applyScramble(scrambleStr){
    const cubies = solvedCubies();
    scrambleStr.trim().split(/\s+/).filter(Boolean).forEach(move => {
      const face = move[0];
      const mod = move.slice(1);
      const times = mod === "'" ? 3 : mod === '2' ? 2 : 1;
      turnFace(cubies, face, times);
    });
    return cubies;
  }

  // grade (linha,coluna) -> (x,y,z,direção) para cada face, layout de rede padrão
  const GRID = {
    U: (r,c) => [c-1, 1, r-1, 'py'],
    D: (r,c) => [c-1, -1, 1-r, 'ny'],
    F: (r,c) => [c-1, 1-r, 1, 'pz'],
    B: (r,c) => [1-c, 1-r, -1, 'nz'],
    L: (r,c) => [-1, 1-r, c-1, 'nx'],
    R: (r,c) => [1, 1-r, 1-c, 'px'],
  };

  const cubeNetEl = document.getElementById('cubeNet');
  const FACE_ORDER = ['U','L','F','R','B','D'];

  function renderCubeNet(scrambleStr){
    const cubies = applyScramble(scrambleStr);
    const byPos = new Map(cubies.map(c => [[c.x,c.y,c.z].join(','), c]));

    cubeNetEl.innerHTML = '';
    FACE_ORDER.forEach(face => {
      const faceEl = document.createElement('div');
      faceEl.className = 'cube-face pos-' + face;
      for(let r=0;r<3;r++){
        for(let c=0;c<3;c++){
          const [x,y,z,dir] = GRID[face](r,c);
          const cubie = byPos.get([x,y,z].join(','));
          const colorKey = cubie ? cubie.colors[dir] : face;
          const sticker = document.createElement('div');
          sticker.className = 'cube-sticker';
          sticker.style.background = COLORS[colorKey] || '#ccc';
          faceEl.appendChild(sticker);
        }
      }
      cubeNetEl.appendChild(faceEl);
    });
  }

  renderCubeNet(currentScramble);

  let cubeVisible = true;
  document.getElementById('cubeToggle').addEventListener('click', (e) => {
    cubeVisible = !cubeVisible;
    cubeNetEl.style.display = cubeVisible ? 'grid' : 'none';
    e.target.textContent = cubeVisible ? 'ocultar' : 'mostrar';
  });

  document.getElementById('newScramble').addEventListener('click', () => {
    currentScramble = genScramble();
    scrambleEl.textContent = currentScramble;
    renderCubeNet(currentScramble);
  });

  // ---------- Timer state machine ----------
  const zone = document.getElementById('timerZone');
  const display = document.getElementById('timerDisplay');
  const hint = document.getElementById('timerHint');

  const STATE = { IDLE:'idle', ARMING:'arming', ARMED:'armed', RUNNING:'running' };
  let state = STATE.IDLE;
  let armTimeout = null;
  let startTime = null;
  let rafId = null;

  const ARM_DELAY = 300; // ms segurado antes de "armar"

  function fmt(ms){
    const s = ms/1000;
    return s.toFixed(2);
  }

  function tick(){
    const elapsed = performance.now() - startTime;
    display.textContent = fmt(elapsed);
    rafId = requestAnimationFrame(tick);
  }

  function press(){
    if(state === STATE.RUNNING) return;
    if(state === STATE.IDLE){
      state = STATE.ARMING;
      armTimeout = setTimeout(() => {
        state = STATE.ARMED;
        zone.classList.add('armed');
        hint.textContent = 'solte para iniciar';
        display.textContent = '0.00';
      }, ARM_DELAY);
    }
  }

  function release(){
    if(state === STATE.ARMING){
      clearTimeout(armTimeout);
      state = STATE.IDLE;
      zone.classList.remove('armed');
      hint.textContent = 'segure espaço (ou toque e segure) para preparar';
    } else if(state === STATE.ARMED){
      state = STATE.RUNNING;
      zone.classList.remove('armed');
      zone.classList.add('running');
      hint.textContent = 'toque para parar';
      startTime = performance.now();
      rafId = requestAnimationFrame(tick);
    } else if(state === STATE.RUNNING){
      cancelAnimationFrame(rafId);
      const elapsed = performance.now() - startTime;
      state = STATE.IDLE;
      zone.classList.remove('running');
      hint.textContent = 'segure espaço (ou toque e segure) para preparar';
      addTime(elapsed);
      currentScramble = genScramble();
      scrambleEl.textContent = currentScramble;
      renderCubeNet(currentScramble);
    }
  }

  document.addEventListener('keydown', (e) => {
    if(e.code === 'Space'){
      e.preventDefault();
      if(!e.repeat) press();
    }
  });
  document.addEventListener('keyup', (e) => {
    if(e.code === 'Space'){
      e.preventDefault();
      release();
    }
  });
  zone.addEventListener('mousedown', press);
  zone.addEventListener('mouseup', release);
  zone.addEventListener('touchstart', (e) => { e.preventDefault(); press(); }, {passive:false});
  zone.addEventListener('touchend', (e) => { e.preventDefault(); release(); }, {passive:false});

  // ---------- Times & stats ----------
  let times = []; // { id, ms, scramble }
  const listEl = document.getElementById('timesList');
  const statBest = document.getElementById('statBest');
  const statAo5 = document.getElementById('statAo5');
  const statAo12 = document.getElementById('statAo12');

  let onNewTime = null;
  let onDeleteTime = null;
  let onClearAll = null;

  function average(arr){
    if(arr.length === 0) return null;
    if(arr.length < 3) return arr.reduce((a,b)=>a+b,0)/arr.length;
    const sorted = [...arr].sort((a,b)=>a-b);
    const trimmed = sorted.slice(1, sorted.length-1);
    return trimmed.reduce((a,b)=>a+b,0)/trimmed.length;
  }

  function renderStats(){
    if(times.length === 0){
      statBest.textContent = '—';
      statAo5.textContent = '—';
      statAo12.textContent = '—';
      return;
    }
    const all = times.map(t => t.ms);
    statBest.textContent = fmt(Math.min(...all));

    const last5 = all.slice(-5);
    statAo5.textContent = last5.length === 5 ? fmt(average(last5)) : '—';

    const last12 = all.slice(-12);
    statAo12.textContent = last12.length === 12 ? fmt(average(last12)) : '—';
  }

  function renderList(){
    if(times.length === 0){
      listEl.innerHTML = '<div class="empty-state">Nenhum tempo ainda. Resolva o cubo pra começar!</div>';
      return;
    }
    listEl.innerHTML = '';
    for(let i = times.length - 1; i >= 0; i--){
      const row = document.createElement('div');
      row.className = 'time-row';
      row.innerHTML = `
        <span class="n">${i+1}</span>
        <span class="t">${fmt(times[i].ms)}</span>
        <span class="s">${times[i].scramble}</span>
        <button class="del" data-idx="${i}" title="remover">×</button>
      `;
      listEl.appendChild(row);
    }
    listEl.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(e.target.getAttribute('data-idx'), 10);
        const [removed] = times.splice(idx, 1);
        renderList();
        renderStats();
        if(onDeleteTime) onDeleteTime(removed);
      });
    });
  }

  function addTime(ms){
    const entry = { id: null, ms, scramble: currentScramble };
    times.push(entry);
    renderList();
    renderStats();
    if(onNewTime) onNewTime(entry);
  }

  document.getElementById('clearAll').addEventListener('click', () => {
    const had = times.length > 0;
    times = [];
    renderList();
    renderStats();
    if(had && onClearAll) onClearAll();
  });

  window.__cubeTimer = {
    setHooks(hooks){
      onNewTime = hooks.onNewTime || null;
      onDeleteTime = hooks.onDeleteTime || null;
      onClearAll = hooks.onClearAll || null;
    },
    loadTimes(arr){
      times = arr;
      renderList();
      renderStats();
    }
  };

})();

// ================= Firebase: auth + sync =================
const signInBtn = document.getElementById('signInBtn');
const signOutBtn = document.getElementById('signOutBtn');
const userInfo = document.getElementById('userInfo');
const userPhoto = document.getElementById('userPhoto');
const userName = document.getElementById('userName');
const syncDot = document.getElementById('syncDot');
const syncText = document.getElementById('syncText');

let currentUid = null;

function setSyncStatus(mode, text){
  syncDot.className = 'sync-dot' + (mode ? ' ' + mode : '');
  syncText.textContent = text;
}

function timesCollection(uid){
  return collection(db, 'users', uid, 'timerTimes');
}

async function loadCloudTimes(uid){
  setSyncStatus('busy', 'carregando...');
  try{
    const q = query(timesCollection(uid), orderBy('createdAt', 'asc'));
    const snap = await getDocs(q);
    const arr = [];
    snap.forEach(d => {
      const data = d.data();
      arr.push({ id: d.id, ms: data.ms, scramble: data.scramble || '' });
    });
    window.__cubeTimer.loadTimes(arr);
    setSyncStatus('ok', 'sincronizado');
  }catch(err){
    console.error(err);
    setSyncStatus('', 'erro ao sincronizar');
  }
}

signInBtn.addEventListener('click', async () => {
  try{
    await signInWithPopup(auth, provider);
  }catch(err){
    console.error(err);
    setSyncStatus('', 'falha no login');
  }
});

signOutBtn.addEventListener('click', async () => {
  await signOut(auth);
});

onAuthStateChanged(auth, async (user) => {
  if(user){
    currentUid = user.uid;
    document.getElementById('authBar').querySelector('.google-btn').style.display = 'none';
    userInfo.style.display = 'flex';
    userPhoto.src = user.photoURL || '';
    userName.textContent = user.displayName || user.email || 'Conta Google';

    window.__cubeTimer.setHooks({
      onNewTime: async (entry) => {
        setSyncStatus('busy', 'sincronizando...');
        try{
          const ref = await addDoc(timesCollection(currentUid), {
            ms: entry.ms,
            scramble: entry.scramble,
            createdAt: serverTimestamp()
          });
          entry.id = ref.id;
          setSyncStatus('ok', 'sincronizado');
        }catch(err){
          console.error(err);
          setSyncStatus('', 'erro ao salvar');
        }
      },
      onDeleteTime: async (entry) => {
        if(!entry || !entry.id) return;
        setSyncStatus('busy', 'sincronizando...');
        try{
          await deleteDoc(doc(db, 'users', currentUid, 'timerTimes', entry.id));
          setSyncStatus('ok', 'sincronizado');
        }catch(err){
          console.error(err);
          setSyncStatus('', 'erro ao remover');
        }
      },
      onClearAll: async () => {
        setSyncStatus('busy', 'limpando...');
        try{
          const snap = await getDocs(timesCollection(currentUid));
          const batch = writeBatch(db);
          snap.forEach(d => batch.delete(d.ref));
          await batch.commit();
          setSyncStatus('ok', 'sincronizado');
        }catch(err){
          console.error(err);
          setSyncStatus('', 'erro ao limpar');
        }
      }
    });

    await loadCloudTimes(currentUid);
  } else {
    currentUid = null;
    document.getElementById('authBar').querySelector('.google-btn').style.display = 'inline-flex';
    userInfo.style.display = 'none';
    window.__cubeTimer.setHooks({});
    window.__cubeTimer.loadTimes([]);
    setSyncStatus('', 'não sincronizado');
  }
});
</script>
